<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ADÜMN · Storyboard General</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111315;
      color: #f4f0e8;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .general-shell {
      width: 100%;
      min-height: 100vh;
      background: #111315;
    }

    .general-header {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 72px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: rgba(17, 19, 21, 0.96);
      border-bottom: 1px solid #34383d;
      backdrop-filter: blur(8px);
    }

    .general-eyebrow {
      display: block;
      margin-bottom: 4px;
      color: #d8a64f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .general-title {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
    }

    .general-meta {
      color: #9da3a9;
      font-size: 13px;
      text-align: right;
    }

    .general-content {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 32px;
    }

    .loading,
    .error,
    .empty-project {
      padding: 80px 20px;
      color: #9da3a9;
      text-align: center;
    }

    .error {
      color: #d98282;
    }

    .scene-section {
      margin-bottom: 54px;
    }

    .scene-header {
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #34383d;
    }

    .scene-number {
      margin-bottom: 5px;
      color: #d8a64f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .scene-heading {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
    }

    .scene-empty {
      padding: 24px;
      border: 1px dashed #34383d;
      border-radius: 8px;
      color: #70767d;
      font-size: 13px;
      text-align: center;
    }

    .shot-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px 22px;
      align-items: start;
    }

    .shot-card {
      overflow: hidden;
      background: #1a1d20;
      border: 1px solid #34383d;
      border-radius: 8px;
    }

    .shot-labels {
      height: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #34383d;
      background: #17191c;
    }

    .shot-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      color: #aeb3b8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .shot-label + .shot-label {
      border-left: 1px solid #34383d;
    }

    .shot-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0d0f11;
      color: #62676d;
      font-size: 13px;
    }

    .shot-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #0d0f11;
    }

    .shot-info {
      padding: 13px 15px 15px;
    }

    .shot-main-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-bottom: 8px;
      color: #f4f0e8;
      font-size: 13px;
      font-weight: 600;
    }

    .shot-secondary {
      color: #a5abb1;
      font-size: 12px;
      line-height: 1.45;
    }

    .shot-description {
      margin-top: 9px;
      color: #d2d5d8;
      font-size: 13px;
      line-height: 1.45;
    }

    .shot-notes {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid #2d3135;
      color: #90969c;
      font-size: 12px;
      line-height: 1.45;
    }

    .shot-notes-label {
      margin-right: 5px;
      color: #71777d;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @media (max-width: 850px) {
      .general-content {
        padding: 22px 16px;
      }

      .general-header {
        align-items: flex-start;
        padding: 14px 16px;
      }

      .general-meta {
        display: none;
      }

      .shot-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      html,
      body,
      .general-shell {
        background: #ffffff;
        color: #000000;
      }

      .general-header {
        position: static;
        padding: 0 0 16px;
        background: #ffffff;
        border-bottom: 1px solid #000000;
        backdrop-filter: none;
      }

      .general-eyebrow,
      .scene-number {
        color: #000000;
      }

      .general-meta {
        color: #000000;
      }

      .general-content {
        width: 100%;
        max-width: none;
        padding: 24px 0;
      }

      .scene-section {
        break-inside: avoid;
        margin-bottom: 36px;
      }

      .scene-header {
        border-color: #000000;
      }

      .shot-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px 14px;
      }

      .shot-card {
        break-inside: avoid;
        background: #ffffff;
        border: 1px solid #000000;
        border-radius: 0;
      }

      .shot-labels {
        background: #ffffff;
        border-color: #000000;
      }

      .shot-label {
        color: #000000;
      }

      .shot-label + .shot-label {
        border-color: #000000;
      }

      .shot-frame {
        background: #ffffff;
        color: #555555;
      }

      .shot-frame img {
        background: #ffffff;
      }

      .shot-main-line,
      .shot-description {
        color: #000000;
      }

      .shot-secondary,
      .shot-notes,
      .shot-notes-label {
        color: #333333;
      }

      .shot-notes {
        border-color: #999999;
      }

      .scene-empty {
        border-color: #777777;
        color: #555555;
      }
    }
  </style>
</head>

<body>
  <main class="general-shell">

    <header class="general-header">

      <div>
        <span class="general-eyebrow">
          STORYBOARD
        </span>

        <h1 class="general-title">
          Storyboard General
        </h1>
      </div>

      <div
        id="generalMeta"
        class="general-meta"
      >
        Cargando proyecto…
      </div>

    </header>

    <section
      id="generalContent"
      class="general-content"
    >
      <div class="loading">
        Cargando Storyboard General…
      </div>
    </section>

  </main>

  <script>
    const params =
      new URLSearchParams(window.location.search);

    const projectId =
      params.get("project");

    const content =
      document.getElementById("generalContent");

    const meta =
      document.getElementById("generalMeta");


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function shotImageMarkup(shot) {
      if (!shot.has_image || !shot.image_url) {
        return `
          <div class="shot-frame">
            Sin imagen
          </div>
        `;
      }

      const imageUrl =
        `${shot.image_url}?v=${encodeURIComponent(
          shot.updated_at || Date.now()
        )}`;

      return `
        <div class="shot-frame">
          <img
            src="${escapeHtml(imageUrl)}"
            alt="Storyboard del plano"
          >
        </div>
      `;
    }


    function shotCardMarkup(
      scene,
      shot,
      shotIndex
    ) {
      const displayShotNumber =
        shotIndex + 1;

      const description =
        shot.description
          ? `
            <div class="shot-description">
              ${escapeHtml(shot.description)}
            </div>
          `
          : "";

      const notes =
        shot.notes
          ? `
            <div class="shot-notes">
              <span class="shot-notes-label">
                Notas
              </span>
              ${escapeHtml(shot.notes)}
            </div>
          `
          : "";

      return `
        <article class="shot-card">

          <div class="shot-labels">
            <div class="shot-label">
              Escena ${escapeHtml(scene.scene_number)}
            </div>

            <div class="shot-label">
              Plano ${displayShotNumber}
            </div>
          </div>

          ${shotImageMarkup(shot)}

          <div class="shot-info">

            <div class="shot-main-line">
              <span>
                ${escapeHtml(
                  shot.shot_type || "Sin tipo"
                )}
              </span>

              <span>
                ${escapeHtml(
                  shot.camera_movement || "Sin movimiento"
                )}
              </span>
            </div>

            <div class="shot-secondary">
              Plano ${displayShotNumber}
            </div>

            ${description}
            ${notes}

          </div>

        </article>
      `;
    }


    function sceneMarkup(scene) {
      const shots =
        Array.isArray(scene.shots)
          ? scene.shots
          : [];

      const shotsMarkup =
        shots.length > 0
          ? `
            <div class="shot-grid">
              ${shots
                .map(
                  (shot, index) =>
                    shotCardMarkup(
                      scene,
                      shot,
                      index
                    )
                )
                .join("")}
            </div>
          `
          : `
            <div class="scene-empty">
              Esta escena todavía no tiene planos.
            </div>
          `;

      return `
        <section class="scene-section">

          <header class="scene-header">

            <div class="scene-number">
              Escena ${escapeHtml(
                scene.scene_number
              )}
            </div>

            <h2 class="scene-heading">
              ${escapeHtml(
                scene.heading || "Sin encabezado"
              )}
            </h2>

          </header>

          ${shotsMarkup}

        </section>
      `;
    }


    async function loadStoryboardGeneral() {
      if (!projectId) {
        meta.textContent =
          "Proyecto no especificado";

        content.innerHTML = `
          <div class="error">
            Falta el ID del proyecto.
          </div>
        `;

        return;
      }

      try {
        const response = await fetch(
          `/api/projects/${projectId}/storyboard`
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        const scenes =
          Array.isArray(data.scenes)
            ? data.scenes
            : [];

        const totalShots =
          scenes.reduce(
            (total, scene) =>
              total +
              (
                Array.isArray(scene.shots)
                  ? scene.shots.length
                  : 0
              ),
            0
          );

        meta.textContent =
          `${scenes.length} escenas · ${totalShots} planos`;

        if (scenes.length === 0) {
          content.innerHTML = `
            <div class="empty-project">
              El proyecto no tiene escenas.
            </div>
          `;

          return;
        }

        content.innerHTML =
          scenes
            .map(sceneMarkup)
            .join("");

      } catch (error) {
        console.error(error);

        meta.textContent =
          "Error al cargar";

        content.innerHTML = `
          <div class="error">
            No se pudo cargar el Storyboard General.
          </div>
        `;
      }
    }


    loadStoryboardGeneral();
  </script>
</body>
</html>
