<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ADÜMN Alpha 0.3</title>

  <link
    rel="stylesheet"
    href="/static/styles.css"
  >
</head>

<body lang="es" spellcheck="true">

  <header class="topbar">

    <div class="topbar-brand">
      <div class="brand">ADÜMN</div>
      <div class="subbrand">Alpha 0.3 · Editor continuo semántico</div>
    </div>

    <div class="topbar-group">
      <span class="topbar-label">Proyecto</span>
      <select id="projectSelect" aria-label="Proyecto"></select>
    </div>

    <span id="saveState">Guardado</span>

    <div class="topbar-group">
      <span class="topbar-label">Duración estimada</span>
      <strong id="projectRuntime">00:00</strong>
    </div>

    <button class="topbar-ai" disabled title="Próximamente">Asistente IA</button>

    <button id="exportPdfButton" title="Exportar proyecto a PDF">Exportar</button>

  </header>


  <main class="workspace">

    <!-- ÍNDICE DE ESCENAS -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <button
          id="newProjectButton"
          title="Nuevo proyecto"
        >
          +
        </button>

      </div>


      <div class="project-title-row">

        <input
          id="projectTitle"
          aria-label="Título del proyecto"
          placeholder="Título del proyecto"
        >

      </div>


      <div class="scene-list-header">

        <span>
          Escenas
        </span>

        <button
          id="newSceneButton"
          title="Insertar una nueva escena"
        >
          Nueva
        </button>

      </div>


      <div
        id="sceneList"
        class="scene-list"
      ></div>

    </aside>


    <!-- DOCUMENTO CONTINUO -->

    <section class="editor">

      <div class="editor-toolbar">

        <div class="editor-toolbar-left">

          <span id="sceneIdentity">
            SIN ESCENA
          </span>

          <span
            id="editorModeLabel"
            class="editor-mode-label"
          >
            ACCIÓN
          </span>

          <select
            id="lineTypeSelector"
            aria-label="Tipo de línea activa"
          ></select>

        </div>


        <div class="editor-toolbar-right">

          <button
            id="toggleInspectorButton"
            class="toolbar-toggle"
            type="button"
            aria-pressed="false"
            title="Mostrar u ocultar inspector"
          >
            Inspector ◂
          </button>

        </div>

      </div>


      <div
        id="screenplayViewport"
        class="screenplay-viewport"
      >

        <article
          id="screenplayEditor"
          class="screenplay-editor"
          aria-label="Editor de guion"
          lang="es"
          spellcheck="true"
          autocorrect="on"
        ></article>

      </div>


      <div class="scene-footer">

        <span>
          Duración de escena activa
        </span>

        <strong id="sceneRuntime">
          00:00
        </strong>

      </div>

    </section>


    <!-- INSPECTOR -->

    <aside class="inspector">

      <div class="tabs">

        <button
          class="tab active"
          data-tab="synopsis"
        >
          Sinopsis
        </button>

        <button
          class="tab"
          data-tab="notes"
        >
          Notas
        </button>

        <button
          class="tab"
          data-tab="breakdown"
        >
          Desglose
        </button>

      </div>


      <!-- SINOPSIS -->

      <section
        id="panel-synopsis"
        class="panel active"
      >

        <label for="sceneSynopsis">
          Sinopsis de la escena activa
        </label>

        <textarea
          id="sceneSynopsis"
          placeholder="Resumen narrativo o de producción"
        ></textarea>

        <button
          id="suggestSynopsisButton"
          class="secondary"
        >
          Proponer sinopsis
        </button>

        <p class="hint">
          La propuesta no modifica el guion.
        </p>

      </section>


      <!-- NOTAS -->

      <section
        id="panel-notes"
        class="panel"
      >

        <div class="inline-form">

          <input
            id="noteInput"
            placeholder="Nueva nota"
          >

          <button id="addNoteButton">
            Agregar
          </button>

        </div>

        <div id="notesList"></div>

      </section>


      <!-- DESGLOSE -->

      <section
        id="panel-breakdown"
        class="panel"
      >

        <div class="breakdown-form">

          <select id="breakdownCategory">

            <option value="prop">
              Prop
            </option>

            <option value="character">
              Personaje
            </option>

            <option value="location">
              Locación
            </option>

            <option value="vehicle">
              Vehículo
            </option>

            <option value="wardrobe">
              Vestuario
            </option>

            <option value="fx">
              FX
            </option>

          </select>


          <input
            id="breakdownName"
            placeholder="Elemento"
          >

          <select id="breakdownState">

            <option value="confirmed">
              Confirmado
            </option>

            <option value="detected">
              Detectado
            </option>

            <option value="rejected">
              Rechazado
            </option>

          </select>


          <button id="addBreakdownButton">
            Agregar
          </button>

        </div>

        <div class="breakdown-form">

          <select id="breakdownFilterCategory">

            <option value="all">
              Todas las categorías
            </option>

            <option value="prop">
              Prop
            </option>

            <option value="character">
              Personaje
            </option>

            <option value="location">
              Locación
            </option>

            <option value="vehicle">
              Vehículo
            </option>

            <option value="wardrobe">
              Vestuario
            </option>

            <option value="fx">
              FX
            </option>

          </select>

          <select id="breakdownFilterState">

            <option value="all">
              Todos los estados
            </option>

            <option value="confirmed">
              Confirmado
            </option>

            <option value="detected">
              Detectado
            </option>

            <option value="rejected">
              Rechazado
            </option>

          </select>

        </div>

        <div class="analysis-block">

          <div class="analysis-title">
            Reconocimiento del guion
          </div>

          <div
            id="scriptAnalysis"
            class="analysis-summary"
          >

            <div class="empty">
              Escribe una escena para analizar su formato.
            </div>

          </div>

        </div>


        <div class="analysis-title">
          Elementos de producción confirmados
        </div>

        <div id="breakdownList"></div>

      </section>

    </aside>

  </main>


  <!-- LISTA DE AUTOCOMPLETADO -->

  <div
    id="autocompleteMenu"
    class="autocomplete-menu"
    hidden
  ></div>


  <script src="/static/app.js"></script>

</body>
</html>
